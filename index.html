<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1b1f24; --muted:#6b7280; --line:#e2e5ea;

    --fill:#d9dde3; --stroke:#2b3440; --ghost:#8b95a3; --dim:#0f766e; --dimq:#aab2bd; --body:#e9ecf0; --hatch:#c3c9d1;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#181b21; --ink:#e8eaee; --muted:#9aa3ad; --line:#2a2f38;
    --accent:#2dd4bf; --accent-ink:#06201c; --soft:#12302c;
    --fill:#3a414b; --stroke:#dfe3e8; --ghost:#6b7280; --dim:#2dd4bf; --dimq:#4b5563; --body:#22272f; --hatch:#3a414b;

  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .wrap>*{min-width:0}
  .card{min-width:0;overflow:hidden}
  .preview{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 2px}
  .preview svg{margin:0;border:1px solid var(--line)}
  @media(min-width:900px){ .wrap{max-width:1040px;grid-template-columns:minmax(0,460px) minmax(0,1fr);align-items:start;column-gap:24px}
    .wrap>.top,.wrap>.steps{grid-column:1/-1} .preview{grid-column:2;grid-row:3/span 8;position:sticky;top:16px;padding:0} .card,.nav{grid-column:1} }
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:20px;margin:0}
  .lang{display:flex;gap:4px}
  .lang button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}
  .lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .steps{display:flex;gap:6px}
  .steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .steps span.on{background:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:17px;margin:0 0 2px}
  .card p.sub{margin:0 0 12px;color:var(--muted);font-size:14px}
  svg{width:100%;max-width:100%;height:auto;display:block;margin:4px 0 8px;background:var(--bg);border-radius:10px}
  svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row label{font-size:15px;flex:1 1 auto;min-width:0}
  .row .step,.row .chips{flex:0 0 auto}
  .row small{display:block;color:var(--muted);font-size:12px}
  .row.wrap{flex-wrap:wrap} .row.wrap label{flex:1 1 100%} .row.wrap .chips{flex:1 1 100%}
  .step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .step button{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
  .step button:disabled{opacity:.3}
  .step input.val{width:76px;border:0;background:transparent;color:var(--ink);text-align:center;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;min-height:40px;padding:0}
  .step input.val:focus{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .nav{display:flex;justify-content:space-between;gap:10px}
  .btn{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.3}
  .summary{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin:0 0 12px}
  input[type=text]{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px 10px;font-size:15px;margin-top:8px}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .grp{margin:0 0 12px}
  .grp small{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}
  #duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
  #duo svg{margin:0}
  @media(min-width:900px){ #duo{grid-template-columns:minmax(0,1fr)} }
  [hidden]{display:none!important}
</style>

  const n=prof.length, V=new Float64Array(n*N*3);
  for(let i=0;i<n;i++){ const [z,r]=prof[i];
    for(let k=0;k<N;k++){ const th=2*Math.PI*k/N, x=r*Math.cos(th), y=r*Math.sin(th); const [z2,y2]=Bd(z,y); const o=(i*N+k)*3; V[o]=x; V[o+1]=y2; V[o+2]=z2; } }
  const tris=[]; const idx=(i,k)=>((i%n)*N+(k%N))*3;
  for(let i=0;i<n;i++) for(let k=0;k<N;k++){ const a=idx(i,k), b=idx(i+1,k), c=idx(i+1,k+1), d=idx(i,k+1); tris.push(a,b,c, a,c,d); }
  // Orientierung: Volumen über Divergenz, bei negativem Volumen alle Dreiecke umdrehen
  let vol=0; for(let t=0;t<tris.length;t+=3){ const a=tris[t],b=tris[t+1],c=tris[t+2];
    vol+=(V[a]*(V[b+1]*V[c+2]-V[b+2]*V[c+1]) - V[a+1]*(V[b]*V[c+2]-V[b+2]*V[c]) + V[a+2]*(V[b]*V[c+1]-V[b+1]*V[c]))/6; }
  const flip=vol<0; const out=new Float32Array(tris.length*3); let o=0;
  for(let t=0;t<tris.length;t+=3){ const ord=flip?[tris[t],tris[t+2],tris[t+1]]:[tris[t],tris[t+1],tris[t+2]]; for(const v of ord){ out[o++]=V[v]; out[o++]=V[v+1]; out[o++]=V[v+2]; } }
  return {tris:out, count:tris.length/3, volume:Math.abs(vol), verts:n*N, P};
}
// @@END

// ---------- 3D-Vorschau (Canvas, Painter-Sortierung, flächige Schattierung) ----------
const V3={yaw:-0.6, pitch:0.5, mesh:null, key:""};
function draw3d(){
  const cv=document.getElementById("c3d"), ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  const k=JSON.stringify([S.A,S.B,S.gap,angle(),S.hard,S.clamp,S.boreA,S.boreB,S.boreEq]); if(V3.key!==k){ V3.mesh=meshOf(S.A,S.B,40); V3.key=k; }
  const T=V3.mesh.tris, n=V3.mesh.count;
  const cy=Math.cos(V3.yaw), sy=Math.sin(V3.yaw), cp=Math.cos(V3.pitch), sp=Math.sin(V3.pitch);
  let minZ=1e9,maxZ=-1e9; for(let i=2;i<T.length;i+=3){ if(T[i]<minZ)minZ=T[i]; if(T[i]>maxZ)maxZ=T[i]; } const zc=(minZ+maxZ)/2;
  const rot=(x,y,z)=>{ z-=zc; const x1=x*cy+z*sy, z1=-x*sy+z*cy; const y1=y*cp-z1*sp, z2=y*sp+z1*cp; return [x1,y1,z2]; };
  const P=new Float32Array(n*9); let ext=1;
  for(let i=0;i<n*9;i+=3){ const [x,y,z]=rot(T[i],T[i+1],T[i+2]); P[i]=x; P[i+1]=y; P[i+2]=z; ext=Math.max(ext,Math.abs(x),Math.abs(y)); }
  const sc=Math.min(W,H)/2/ext*0.9, ox=W/2, oy=H/2, L=[0.4,0.6,0.7], ll=Math.hypot(...L);
  const order=new Array(n); for(let t=0;t<n;t++){ const b=t*9; order[t]=[ (P[b+2]+P[b+5]+P[b+8])/3, t ]; } order.sort((a,b)=>a[0]-b[0]);
  const css=getComputedStyle(document.documentElement), base=css.getPropertyValue("--fill").trim()||"#d9dde3", dark=matchMedia("(prefers-color-scheme: dark)").matches;
  ctx.clearRect(0,0,W,H);
  for(const [,t] of order){ const b=t*9, ax=P[b+3]-P[b],ay=P[b+4]-P[b+1],az=P[b+5]-P[b+2], bx=P[b+6]-P[b],by=P[b+7]-P[b+1],bz=P[b+8]-P[b+2];
    const nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx, nl=Math.hypot(nx,ny,nz)||1; if(nz<0) continue;   // Rückseiten weg
    const sh=0.35+0.65*Math.max(0,(nx*L[0]+ny*L[1]+nz*L[2])/(nl*ll)); const g=Math.round((dark?150:205)*sh)+(dark?30:30);
    ctx.fillStyle=`rgb(${g},${g+4},${g+10})`; ctx.strokeStyle=ctx.fillStyle;
    ctx.beginPath(); ctx.moveTo(ox+P[b]*sc, oy-P[b+1]*sc); ctx.lineTo(ox+P[b+3]*sc, oy-P[b+4]*sc); ctx.lineTo(ox+P[b+6]*sc, oy-P[b+7]*sc); ctx.closePath(); ctx.fill(); ctx.stroke(); }
}
{ const cv=document.getElementById("c3d"); let drag=null;
  cv.addEventListener("pointerdown",e=>{ drag=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove",e=>{ if(!drag) return; V3.yaw+=(e.clientX-drag[0])*0.01; V3.pitch=Math.max(-1.5,Math.min(1.5,V3.pitch+(e.clientY-drag[1])*0.01)); drag=[e.clientX,e.clientY]; draw3d(); });
  cv.addEventListener("pointerup",()=>drag=null); cv.addEventListener("pointercancel",()=>drag=null); }

// ---------- Text ----------
const NFK=["nf0","nf1","nf2","nf3","nf4"];
// Anfragetext immer Deutsch (Michael liest ihn), unabhängig von der Oberflächensprache. Komma als Dezimaltrenner.
const td=k=>T.de[k]??k, fd=v=>String(Math.round(v*10)/10).replace(".",",");
function sideTxt(X){ return `Ø ${fd(X.d)}, ${td("sumLen")} ${fd(X.len)}, ${td("sumNut")} ${td(NFK[X.nf])}`+(X.nf?` ${X.nn}x, ${td("sumPos")} ${fd(X.np)}, ${td("sumW")} ${fd(X.nw)}, ${td(X.nf===3?"ndH":"sumD")} ${fd(X.nd)}`+(X.nn===2?`, ${td("ng")} ${fd(X.ng)}`:""):""); }
function code(){ const f=v=>String(Math.round(v*10)/10).replace(".",","); const n=X=>X.nf?`${X.nn}${["","h","e","w","s"][X.nf]}${f(X.np)}`:"0";
  return `XAG ${f(S.A.d)}/${f(S.A.len)}/${n(S.A)} | ${f(S.B.d)}/${f(S.B.len)}/${n(S.B)} | S${f(S.gap)} L${f(total())} | ${f(angle())}° | ${"WMH"[S.hard]} | ${S.clamp?"B":"S"} | D${f(S.boreA)}${S.boreEq?"":"-"+f(S.boreB)}${S.shape?"hz":"r"} | ${LANG}`; }
function v(id){ return document.getElementById(id).value.trim(); }
function summary(){ return [
  `${td("sumH")}: ${(S.carb.m==="?"?td("other"):[S.carb.m,S.carb.r,S.carb.s||""].filter(Boolean).join(" "))} ↔ ${(S.st.m==="?"?td("other"):[S.st.m,S.st.v].filter(Boolean).join(" "))}`,
  `${td("sumA")}: ${sideTxt(S.A)}`,
  `${td("sumB")}: ${sideTxt(S.B)}`,
  `${td("sumGap")} ${fd(S.gap)} mm, ${td("total")} ${fd(total())} mm, ${td("sumAng")} ${fd(angle())}°, ${td(["soft","mid","hardV"][S.hard])}, ${td("sumClamp")} ${td(S.clamp?"wide":"narrow")} ${fd(CLAMP[S.clamp])} mm, ${td("bore")} ${fd(S.boreA)}${S.boreEq?"":" / "+fd(S.boreB)} ${td(S.shape?"heart":"round")}`,
  `Code: ${code()}`,
  `STL: ${S.wantStl? td("yes") : td("no")} | ${td("clamps")}: ${S.clamps? "2" : td("no")}`,
  `${td("sumName")}: ${v("name")} | ${td("sumBike")}: ${v("bike")}${v("note")?" | "+td("sumNote")+": "+v("note"):""}` ].join("\n"); }

// ---------- Render ----------
const chips=(id,items,sel,label)=>{ document.getElementById(id).innerHTML=items.map(x=>`<button class="chip" data-v="${x}" aria-pressed="${String(x)===String(sel)}">${label(x)}</button>`).join(""); };
function renderStep0(){
  const ms=[...new Set(CARBS.map(c=>c.m))]; chips("carbM",ms,S.carb.m,x=>x==="?"?t("other"):x);
  const rs=CARBS.filter(c=>c.m===S.carb.m).map(c=>c.r); document.getElementById("carbRwrap").hidden = rs.length<2 || !rs[0]; chips("carbR",rs,S.carb.r,x=>x);
  const row=CARBS.find(c=>c.m===S.carb.m&&c.r===S.carb.r)||CARBS.find(c=>c.m===S.carb.m); chips("carbS",row.s,S.carb.s,x=>x?fmt(x):t("other"));
  document.getElementById("carbS").parentElement.hidden = row.s.length===1 && !row.s[0];
  const sm=STUTZEN.map(x=>x.m); chips("stM",sm,S.st.m,x=>x==="?"?t("other"):x);
  const st=STUTZEN.find(x=>x.m===S.st.m); document.getElementById("stVwrap").hidden = !(st.v.length>1 || st.v[0]); chips("stV",st.v,S.st.v,x=>x||t("other"));
  document.getElementById("pairInfo").textContent = (S.known? t("pairOk") : t("pairNone")) + "  (" + pname() + ")";
}
function render(){
  if(S.mirror) S.B={...S.A};
  document.querySelectorAll("[data-step]").forEach(el=>{ const st=+el.dataset.step; el.hidden = !(st===S.step || (st===1 && S.step===2)); });
  document.getElementById("steps").innerHTML=Array.from({length:STEPS},(_,i)=>`<span class="${i<=S.step?"on":""}"></span>`).join("");
  document.getElementById("back").disabled=S.step===0; document.getElementById("next").hidden=S.step===STEPS-1;
  document.getElementById("next").textContent = S.step===STEPS-2 ? t("toReq") : t("next");
  const X=cur(), onB=S.step===2;
  autoBore(S.A,S.B); if(S.boreEq) S.boreB=S.boreA;
  document.getElementById("boreBRow").hidden=!!S.boreEq; document.getElementById("boreLbl").textContent=t(S.boreEq?"bore":"boreA");
  document.getElementById("sideTitle").textContent = t(onB?"s2h":"s1h");
  document.getElementById("sideSub").textContent = t(onB?"s2p":"s1p");
  document.getElementById("mirrorRow").hidden=!onB; document.getElementById("sideFields").hidden = onB && S.mirror===1;
  document.querySelector(".nut").hidden = X.nf===0; document.querySelector(".nut2").hidden = X.nn!==2; document.getElementById("ndLabel").textContent = t(X.nf===3?"ndH":"nd");
  document.getElementById("angFreeRow").hidden = S.ang!=="free";
  document.querySelectorAll(".step").forEach(el=>{ const k=el.dataset.k, val = k in X ? X[k] : S[k]; const inp=el.querySelector("input.val"); if(document.activeElement!==inp) inp.value=fmt(val)+(k==="angFree"?"°":" mm"); });
  document.querySelectorAll(".chips[data-k]").forEach(el=>{ const k=el.dataset.k, val = k in X ? X[k] : S[k]; el.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", String(val)===b.dataset.v)); });
  if(S.step===0) renderStep0();
  const pv=document.getElementById("preview"); pv.hidden = !(S.step>=1&&S.step<=4);
  ["sk1","sk3","sk4"].forEach(id=>{ const on=(id==="sk1"&&(S.step===1||S.step===2))||(id==="sk3"&&S.step===3)||(id==="sk4"&&S.step===4); const el=document.getElementById(id); if(on) el.removeAttribute("hidden"); else el.setAttribute("hidden",""); });
  if(S.step===1||S.step===2) drawSide(document.getElementById("sk1"), X, t(onB?"motor":"carb"), onB?"manifold":"carb");
  if(S.step===3) drawInstall(document.getElementById("sk3"));
  document.getElementById("duo").hidden = S.step!==4;
  if(S.step===4){ drawGummi(document.getElementById("sk4")); draw3d(); const bi=document.getElementById("boreInfo"); bi.textContent = S.shape===1 ? t("boreHeart") : (S.carb.m==="SmartCarb" ? t("boreSC") : ""); bi.hidden = !bi.textContent; }
  if(S.step===5) document.getElementById("summary").textContent=summary();
}

// ---------- Events ----------
document.getElementById("lang").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setLang(b.dataset.l); });
const pick=(id,fn)=>document.getElementById(id).addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; fn(b.dataset.v); loadPair(); render(); });
pick("carbM",v=>{ const row=CARBS.find(c=>c.m===v); S.carb={m:v,r:row.r,s:row.s[0]}; });
pick("carbR",v=>{ const row=CARBS.find(c=>c.m===S.carb.m&&c.r===v); S.carb={m:S.carb.m,r:v,s:row.s[0]}; });
pick("carbS",v=>{ S.carb.s=parseFloat(v); });
pick("stM",v=>{ const row=STUTZEN.find(x=>x.m===v); S.st={m:v,v:row.v[0]}; });
pick("stV",v=>{ S.st.v=v; });
document.querySelectorAll(".step").forEach(el=>{
  const k=el.dataset.k, s=parseFloat(el.dataset.s), [b1,b2]=el.querySelectorAll("button");
  const clamp=v=>Math.min(LIM[k][1],Math.max(LIM[k][0],Math.round(v*10)/10));
  const set=d=>{ const X=cur(), tgt = k in X ? X : S; tgt[k]=clamp(tgt[k]+d); if(k.startsWith("bore")) S.boreAuto=false; S.active=k; render(); };
  b1.addEventListener("click",()=>set(-s)); b2.addEventListener("click",()=>set(s));
  const inp=el.querySelector("input.val");
  inp.addEventListener("focus",()=>{ const X=cur(); inp.value=String(k in X ? X[k] : S[k]).replace(".",LANG==="en"?".":","); inp.select(); S.active=k; render(); });
  inp.addEventListener("input",()=>{ const v=parseFloat(inp.value.replace(",",".")); if(isFinite(v)){ const X=cur(), tgt = k in X ? X : S; tgt[k]=clamp(v); if(k.startsWith("bore")) S.boreAuto=false; render(); } });
  inp.addEventListener("blur",()=>render());
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") inp.blur(); });
});
document.querySelectorAll(".chips[data-k]").forEach(el=>el.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return; const k=el.dataset.k, val=b.dataset.v, X=cur();
  const num = k==="ang" ? val : parseFloat(val);
  if(k in X) X[k]=num; else S[k]=num;
  if(k==="mirror"&&S.mirror===0) S.B={...S.A};
  S.active=k; render();
}));
document.getElementById("back").addEventListener("click",()=>{ S.step=Math.max(0,S.step-1); S.active=""; render(); window.scrollTo(0,0); });
document.getElementById("next").addEventListener("click",()=>{ S.step=Math.min(STEPS-1,S.step+1); S.active=""; render(); window.scrollTo(0,0); });
["name","bike","note"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{ document.getElementById("summary").textContent=summary(); }));
document.getElementById("copy").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(summary()); alert(t("copied")); }catch(e){ alert(t("copyFail")); } });
loadPair();
{ const m=location.hash.match(/step=(\d)/); if(m) S.step=Math.min(STEPS-1,+m[1]); const a=location.hash.match(/ang=([\d.]+)/); if(a){ S.ang="free"; S.angFree=+a[1]; }
  if(/q=2/.test(location.hash)){ S.carb={m:"SmartCarb",r:"SC2",s:40}; S.st={m:"Quattrini",v:"M200S"}; loadPair(); }
  if(/q=1/.test(location.hash)){ S.carb={m:"SmartCarb",r:"SC2",s:40}; S.st={m:"Quattrini",v:"M200S"}; loadPair(); S.mirror=0; S.B.nf=3; S.B.nd=1; S.B.len=30; S.B.np=3; S.B.nw=3; } }
setLang(detectLang());
</script>
