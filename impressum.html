    <h3>${t.contact}</h3><p>${t.mail}: <span id="ml"></span></p><h3>${t.resp}</h3><p>${D("n")}, ${t.respT}</p><h3>${t.odr}</h3><p class="muted">${t.odrT}</p>`;

    <h3>${t.conf}</h3><p>${t.confT}</p><h3>${t.wa}</h3><p>${t.waT}</p><h3>${t.em}</h3><p>${t.emT}</p><h3>${t.ord}</h3><p>${t.ordT}</p><h3>${t.ret}</h3><p>${t.retT}</p><h3>${t.fbk}</h3><p>${t.fbkT}</p><h3>${t.pub}</h3><p>${t.pubT}</p><h3>${t.rights}</h3><p>${t.rightsT}</p>`;
